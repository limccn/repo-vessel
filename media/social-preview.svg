<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-label="码之灵龛 / Repo Vessel — 2026 Halloween">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1211"/>
      <stop offset="0.55" stop-color="#080d0c"/>
      <stop offset="1" stop-color="#060a09"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#c9a227" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e4c463" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e4c463" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E4A6"/>
      <stop offset="0.45" stop-color="#D9B54A"/>
      <stop offset="1" stop-color="#8C6A1E"/>
    </linearGradient>

    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2E6B"/>
      <stop offset="1" stop-color="#241638"/>
    </linearGradient>

    <radialGradient id="flameGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5FE8C8" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#3CC9A8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#3CC9A8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#c9a227" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0.4"/>
    </linearGradient>

    <mask id="moonMask">
      <rect width="1280" height="640" fill="#fff"/>
      <circle cx="1176" cy="112" r="43" fill="#000"/>
    </mask>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <ellipse cx="640" cy="286" rx="380" ry="300" fill="url(#halo)"/>

  <path d="M56 32 H1224 L1248 56 V584 L1224 608 H56 L32 584 V56 Z"
        fill="none" stroke="url(#frame)" stroke-width="1.5"/>

  <!-- moon -->
  <circle cx="1148" cy="132" r="120" fill="url(#moonGlow)"/>
  <circle cx="1146" cy="126" r="46" fill="#e4c463" opacity="0.6" mask="url(#moonMask)"/>

  <!-- corner web -->
  <g fill="none" stroke="#c9a227" stroke-opacity="0.18" stroke-width="1">
    <path d="M1248 32 L1160 96"/>
    <path d="M1248 32 L1196 136"/>
    <path d="M1248 32 L1136 44"/>
    <path d="M1200 50 Q1186 58 1184 78"/>
    <path d="M1186 41 Q1166 50 1162 70"/>
  </g>

  <!-- bats -->
  <g fill="#0a0f0e" stroke="#c9a227" stroke-opacity="0.3" stroke-width="1.1">
    <path d="M1024 168 c9 -10 20 -10 27 0 c7 -10 18 -10 27 0 c-8 1 -13 5 -19 12 c-3 -3 -5 -3 -8 0 c-5 -6 -10 -8 -19 -12 Z"/>
    <path d="M1086 208 c6 -7 13 -7 18 0 c5 -7 12 -7 18 0 c-5 1 -9 4 -13 8 c-2 -2 -3 -2 -5 0 c-4 -4 -7 -7 -13 -8 Z"/>
  </g>

  <!-- the vessel -->
  <g transform="translate(531 76) scale(3.4)">
    <circle cx="32" cy="32" r="21" fill="url(#flameGlow)"/>
    <path d="M23 18l4.5-5 3.5 5h2l3.5-5 4.5 5z" fill="url(#gold)"/>
    <rect x="19" y="17.5" width="26" height="5" rx="2.5" fill="url(#gold)"/>
    <path d="M23 25h18v5l-3.5 4v13l4.5 5v3H22v-3l4.5-5V34L23 30z" fill="url(#gold)"/>
    <path d="M27 34h10v11l-5 4.5-5 -4.5z" fill="url(#plum)"/>
    <path d="M32 36c2 2.2 3 3.9 3 5.7 0 2.1-1.4 3.6 -3 3.6s-3 -1.5 -3 -3.6c0 -1.8 1 -3.5 3 -5.7z" fill="#7DF0D8"/>
    <path d="M22 54h20v3H22z" fill="url(#gold)" opacity="0.9"/>
  </g>

  <!-- ember sparks -->
  <g fill="#ffb266">
    <circle cx="640" cy="64" r="2.4" opacity="0.7"/>
    <circle cx="618" cy="48" r="1.6" opacity="0.45"/>
    <circle cx="664" cy="44" r="1.2" opacity="0.35"/>
    <circle cx="634" cy="30" r="0.9" opacity="0.25"/>
  </g>

  <!-- lockup -->
  <text x="640" y="404" fill="#e9e3d3" text-anchor="middle"
        font-family="SimSun, 'Noto Serif SC', serif" font-size="72" letter-spacing="10">码之灵龛</text>

  <text x="640" y="450" fill="#c9a227" text-anchor="middle"
        font-family="Constantia, Georgia, 'Times New Roman', serif" font-size="20"
        letter-spacing="12">REPO VESSEL</text>

  <text x="640" y="508" fill="#a9a79c" text-anchor="middle"
        font-family="Constantia, Georgia, 'Times New Roman', serif" font-size="21">
    When a project falls in battle, its ashes come to rest in this vessel.
  </text>

  <text x="72" y="580" fill="#c9a227" fill-opacity="0.58"
        font-family="Constantia, Georgia, 'Times New Roman', serif" font-size="15"
        letter-spacing="5">2026 · HALLOWEEN</text>

  <text x="1208" y="580" fill="#95968b" text-anchor="end"
        font-family="ui-monospace, Consolas, monospace" font-size="15"
        letter-spacing="2">repovessel.lmlh.net</text>
</svg>
