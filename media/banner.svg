<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="480" viewBox="0 0 1600 480" role="img" aria-label="码之灵龛 / Repo Vessel — 2026 Halloween">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1211"/>
      <stop offset="0.55" stop-color="#080d0c"/>
      <stop offset="1" stop-color="#060a09"/>
    </linearGradient>

    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.13"/>
      <stop offset="0.6" stop-color="#c9a227" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="moonGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e4c463" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#e4c463" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6E4A6"/>
      <stop offset="0.45" stop-color="#D9B54A"/>
      <stop offset="1" stop-color="#8C6A1E"/>
    </linearGradient>

    <linearGradient id="plum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4A2E6B"/>
      <stop offset="1" stop-color="#241638"/>
    </linearGradient>

    <radialGradient id="flameGlow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#5FE8C8" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#3CC9A8" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#3CC9A8" stop-opacity="0"/>
    </radialGradient>

    <mask id="moonMask">
      <rect width="1600" height="480" fill="#fff"/>
      <circle cx="1448" cy="90" r="49" fill="#000"/>
    </mask>

    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9a227" stop-opacity="0.5"/>
      <stop offset="0.5" stop-color="#c9a227" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c9a227" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- field -->
  <rect width="1600" height="480" fill="url(#bg)"/>
  <ellipse cx="330" cy="248" rx="330" ry="260" fill="url(#halo)"/>

  <!-- frame: cut corners, the same 45° geometry as the site panels -->
  <path d="M44 24 H1556 L1576 44 V436 L1556 456 H44 L24 436 V44 Z"
        fill="none" stroke="url(#frame)" stroke-width="1.5"/>

  <!-- moon -->
  <circle cx="1420" cy="118" r="140" fill="url(#moonGlow)"/>
  <circle cx="1418" cy="112" r="54" fill="#e4c463" opacity="0.62" mask="url(#moonMask)"/>

  <!-- bats, crossing the moon's light -->
  <g fill="#0a0f0e" stroke="#c9a227" stroke-opacity="0.3" stroke-width="1.1">
    <path d="M1296 158 c10 -11 22 -11 30 1 c8 -12 20 -12 30 -1 c-9 1 -15 6 -21 13 c-3 -3 -6 -3 -9 0 c-6 -7 -12 -12 -21 -13 Z"/>
    <path d="M1362 206 c7 -8 15 -8 21 0 c6 -8 14 -8 21 0 c-6 1 -11 4 -15 9 c-2 -2 -4 -2 -6 0 c-4 -5 -8 -8 -15 -9 Z"/>
    <path d="M1240 214 c5 -6 11 -6 15 0 c4 -6 10 -6 15 0 c-5 1 -8 3 -11 7 c-1 -1 -3 -1 -4 0 c-3 -4 -6 -6 -11 -7 Z"/>
  </g>

  <!-- corner web, kept inside the last 130px so it never crosses the moon -->
  <g fill="none" stroke="#c9a227" stroke-opacity="0.18" stroke-width="1">
    <path d="M1576 24 L1476 96"/>
    <path d="M1576 24 L1520 140"/>
    <path d="M1576 24 L1452 34"/>
    <path d="M1520 44 Q1504 54 1502 76"/>
    <path d="M1504 34 Q1482 44 1478 66"/>
  </g>

  <!-- the vessel: the brand mark, drawn at 4× -->
  <g transform="translate(202 108) scale(4)">
    <circle cx="32" cy="32" r="21" fill="url(#flameGlow)"/>

    <!-- cat-ear lid -->
    <path d="M23 18l4.5-5 3.5 5h2l3.5-5 4.5 5z" fill="url(#gold)"/>
    <rect x="19" y="17.5" width="26" height="5" rx="2.5" fill="url(#gold)"/>

    <!-- body -->
    <path d="M23 25h18v5l-3.5 4v13l4.5 5v3H22v-3l4.5-5V34L23 30z" fill="url(#gold)"/>

    <!-- window -->
    <path d="M27 34h10v11l-5 4.5-5-4.5z" fill="url(#plum)"/>

    <!-- flame -->
    <path d="M32 36c2 2.2 3 3.9 3 5.7 0 2.1-1.4 3.6-3 3.6s-3-1.5-3-3.6c0-1.8 1-3.5 3-5.7z"
          fill="#7DF0D8"/>

    <!-- base -->
    <path d="M22 54h20v3H22z" fill="url(#gold)" opacity="0.9"/>
  </g>

  <!-- pumpkin-ember sparks drifting up from the vessel -->
  <g fill="#ffb266">
    <circle cx="330" cy="96" r="2.6" opacity="0.75"/>
    <circle cx="306" cy="78" r="1.8" opacity="0.5"/>
    <circle cx="352" cy="70" r="1.4" opacity="0.4"/>
    <circle cx="318" cy="54" r="1.1" opacity="0.3"/>
    <circle cx="368" cy="104" r="1.2" opacity="0.38"/>
    <circle cx="292" cy="112" r="1.2" opacity="0.34"/>
  </g>

  <!-- ash fall -->
  <g fill="#e9e3d3">
    <circle cx="132" cy="392" r="1.2" opacity="0.16"/>
    <circle cx="228" cy="414" r="0.9" opacity="0.11"/>
    <circle cx="404" cy="378" r="1.1" opacity="0.13"/>
    <circle cx="486" cy="408" r="0.8" opacity="0.09"/>
    <circle cx="520" cy="322" r="1" opacity="0.12"/>
    <circle cx="104" cy="292" r="0.9" opacity="0.09"/>
  </g>

  <!-- wordmark -->
  <g>
    <text x="640" y="200" fill="#e9e3d3"
          font-family="SimSun, 'Noto Serif SC', serif" font-size="92" letter-spacing="12">码之灵龛</text>

    <text x="644" y="242" fill="#c9a227"
          font-family="Constantia, Georgia, 'Times New Roman', serif" font-size="24"
          letter-spacing="13">REPO VESSEL</text>

    <path d="M644 272 H720" stroke="#c9a227" stroke-opacity="0.5" stroke-width="1.5"/>

    <text x="644" y="314" fill="#a9a79c"
          font-family="Constantia, Georgia, 'Times New Roman', serif" font-size="21">
      When a project falls in battle,
    </text>
    <text x="644" y="344" fill="#a9a79c"
          font-family="Constantia, Georgia, 'Times New Roman', serif" font-size="21">
      its ashes come to rest in this vessel.
    </text>
  </g>

  <!-- corner marks -->
  <text x="644" y="424" fill="#c9a227" fill-opacity="0.58"
        font-family="Constantia, Georgia, 'Times New Roman', serif" font-size="15"
        letter-spacing="6">2026 · HALLOWEEN</text>

  <text x="1552" y="424" fill="#95968b" text-anchor="end"
        font-family="ui-monospace, Consolas, monospace" font-size="14"
        letter-spacing="2">repovessel.lmlh.net</text>
</svg>
